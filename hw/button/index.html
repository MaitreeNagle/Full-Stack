<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coaching Institute Theme</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
         :root {
            --bs-primary: #6f42c1;
            --bs-success: #198754;
            --bs-warning: #ffc107;
        }
        
        .custom-button {
            border-radius: 20px;
            padding: 10px 24px;
            font-weight: bold;
        }
        
        .custom-card {
            border-radius: 16px;
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <h1 class="text-center">
            RICR Coaching Institute
        </h1>

        <p class="text-center">
            Build your skills with our professional courses.
        </p>

        <!-- Custom Theme Buttons -->
        <div class="mb-4">
            <button class="btn btn-primary">
                Primary Course
            </button>

            <button class="btn btn-success">
                Success Course
            </button>

            <button class="btn btn-warning">
                Warning Course
            </button>
        </div>

        <!-- Custom Button -->
        <button class="btn btn-primary custom-button mb-4">
            Enroll Now
        </button>

        <!-- Custom Card -->
        <div class="card custom-card">
            <div class="card-body">
                <h5 class="card-title">
                    Web Development
                </h5>

                <p class="card-text">
                    Learn HTML, CSS and JavaScript through practical training.
                </p>
            </div>
        </div>

    </div>

</body>

</html>
