    <script>
        /*Create a JavaScript program to manage a course list using array methods.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        */
        //push
        const courses = ["btech", "bba", "mba"];
        courses.push("LLB");
        console.log("After push():", courses);
        console.log(courses.length);

        //pop
        courses.pop();
        console.log("After pop", courses);

        //unshift
        courses.unshift("Bio-tech");
        courses.unshift("cse");
        console.log(courses.length);
        console.log("after unshift", courses);
        //shift
        courses.shift();
        courses.shift();
        console.log("after shift", courses);
        // Display final array and length
        console.log("Final Courses:", courses);
        console.log("Final Length:", courses.length);
    </script>
