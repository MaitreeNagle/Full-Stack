<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const courses = ["DSA", "DS", "AI", "ML", "DBMS", "TOC"];
        courses.forEach((courses, index) => {
            console.log("courses: ", courses, "index:", index);

        });
        courses.forEach((courses, index) => {
            console.log("index:", index + 1, "courses: ", courses);

        });

        const marks = [70, 85, 60, 90, 50];
        let total = 0;

        marks.forEach((marks) => {
            total = total + marks;
        });
        console.log("Total Marks : ", total);
    </script>

</body>
