<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Arithmetic Operators
        let subject1 = 80;
        let subject2 = 70;

        console.log(subject1 + subject2);
        console.log(subject1 - subject2);
        console.log(subject1 * subject2);
        console.log(subject1 / subject2);

        // Modulus
        let totalMarks = subject1 + subject2;

        console.log(totalMarks % 3);

        // Exponentiation
        console.log(2 ** 3);

        // Assignment Operators
        let score = 50;

        score += 10;
        console.log(score);

        score -= 5;
        console.log(score);

        score *= 2;
        console.log(score);

        score /= 5;
        console.log(score);

        // Comparison Operators
        console.log(score > 10);
        console.log(score < 20);
        console.log(score >= 20);
        console.log(score <= 20);

        // == and ===
        console.log(5 == "5");
        console.log(5 === "5");
    </script>

</body>

</html>
