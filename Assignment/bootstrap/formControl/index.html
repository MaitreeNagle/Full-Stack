<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <div class="container   mb-3">
        <h1>Form</h1>
        <form>


            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder=" enter your name">
            </div>
            <div class="mb-3">
                <label for="pass" class="form-label">Password</label> <input type="password" class="form-control" id="pass">
            </div>
            <div><textarea class="form-control" rows="4" placeholder="Enter your address"></textarea></div>
            <br>
            <div><select class="form-select">
    <option selected>Select a course</option>
    <option>HTML</option>
    <option>CSS</option>
    <option>JavaScript</option>
</select></div>
            <br>
            <button type="submit" class=" btn btn-primary">submit</button>
        </form>
    </div>


    <div class="container   mb-3">
        <h1>Form</h1>
        <form>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstname" class="form-label">First Name</label>
                    <input type="text" id="firstname" class="form-control" placeholder=" enter your FirstName">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lastname" class="form-label">LastName</label>
                    <input type="text" id="firstname" class="form-control" placeholder=" enter your LastName">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" placeholder="enter your valid email id" class="form-control  is-valid" value="abc@gmail.com"> <input type="email" class="form-control is-invalid" id="email">
            </div>
            <div class="mb-3">
                <label for="course">course</label>
                <select name="course" id="course">
                    <option selected>select Course</option>
                     <option>HTML</option>
                    <option>CSS</option>
                       <option>JavaScript</option>
                </select>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="level" id="beginner">

                <label class="form-check-label" for="beginner">
                 Beginner
             </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="level" id="advanced">

                <label class="form-check-label" for="advanced">
                   Advanced
            </label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="notifications">

                <label class="form-check-label" for="notifications">
        Enable Notifications
    </label>
            </div>
        </form>
    </div>
    <div></div>
    <!-- bootstrapscript -->
    <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js " integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI " crossorigin="anonymous "></script>
</body>

</html>
