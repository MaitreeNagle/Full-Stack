<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="mb-4">Course Dashboard</h2>

        <!-- View Course Button -->
        <button type="button" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#courseModal">
      View Course
    </button>

        <!-- Delete Course Button -->
        <button type="button" class="btn btn-danger me-2" data-bs-toggle="modal" data-bs-target="#deleteModal">
      Delete Course
    </button>

        <!-- Tooltip -->
        <button type="button" class="btn btn-secondary me-2" data-bs-toggle="tooltip" data-bs-title="Save your changes">
      Save
    </button>

        <!-- Popover -->
        <button type="button" class="btn btn-primary" data-bs-toggle="popover" data-bs-title="Course Information" data-bs-content="This course covers HTML, CSS, JavaScript and Bootstrap.">
      Course Info
    </button>

    </div>


    <!-- Course Details Modal -->
    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Web Development
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">
                    Learn HTML, CSS, JavaScript and Bootstrap.
                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Close
          </button>

                    <button type="button" class="btn btn-primary">
            Start Course
          </button>

                </div>

            </div>

        </div>
    </div>


    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Delete Course
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">
                    Are you sure you want to delete this course?
                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>

                    <button type="button" class="btn btn-danger">
            Delete
          </button>

                </div>

            </div>

        </div>
    </div>


    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
