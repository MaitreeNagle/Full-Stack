<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <div class="container   mb-3">
        <h1>Form</h1>
        <form>
            <div class=" input-group mb-3">
                <span class="input-group-icon
                ">@</span>
                <input type="text" placeholder="username" class="form-control">
            </div>
            <div class="input-group  mb-3">
                <span class="input-group-text">https://</span>
                <input type="text" placeholder="website address" class="form-control">
            </div>
            <div class="input-group mb-3">
                <input type="text" placeholder="course" class="form-control">
                <button class="input-group-button  btn btn-primary">Search</button>
            </div>
            <div class="mb-3">
                <label for="email">Email Address</label> <input type="email" class="form-control  is-valid" id="email" value="student@example.com">
                <div class="valid-feedback">
                    Email address is Valid
                </div>

            </div>
            <div class="mb-3">
                <label for="email">Email  Address </label> <input type="email" class="form-control  is-invalid" id="email">
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>

            </div>
        </form>

        <!-- bootstrapscript -->
        <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js " integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI " crossorigin="anonymous "></script>
</body>

</html>
